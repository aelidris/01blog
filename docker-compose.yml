services:
  postgres-db:
    image: postgres:16
    container_name: blog_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend-api:
    build: ./backend
    container_name: blog-backend
    depends_on:
      - postgres-db
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres-db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
    volumes:
      - ./uploads:/app/uploads

  frontend-ui:
    build: ./frontend
    container_name: blog-frontend
    depends_on:
      - backend-api
    ports:
      - "4200:80"

volumes:
  pgdata: