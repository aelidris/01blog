spring.application.name=01blog

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/blog01
spring.datasource.username=aelidris
spring.datasource.password=01blog_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=01BlogSuperSecretKeyForJWTTokenGenerationMustBeLongEnough2024
app.jwt.expiration=86400000

# File upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=uploads

# CORS
app.cors.allowed-origins=http://localhost:4200

server.port=8080
